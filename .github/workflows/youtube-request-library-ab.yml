name: YouTube Request Library Diagnostic

on:
  push:
    branches: [codex/youtube-request-library-ab]
    paths:
      - tests/check_youtube_cookie_ab.py
      - tests/check_youtube_request_ab.py
      - .github/workflows/youtube-request-library-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-ab:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.59.0-noble@sha256:d8d9811a0e7cfac967f0c2f55d12b739087ae4b0808577b794c2a29ed5124938
      options: --init
    timeout-minutes: 30
    env:
      HYPE_DB_BACKEND: sqlite
      PYTHONUNBUFFERED: '1'
      NODE_OPTIONS: '--max-http-header-size=262144'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install unchanged dependencies and prepare diagnostic output
        run: |
          python -m pip install -r requirements.txt
          mkdir -p diagnostic-artifacts/request-ab
      - name: Compare libraries with fixed cookies, pairs 1 to 4
        run: python tests/check_youtube_request_ab.py 1 diagnostic-artifacts/request-ab/wire-1.log 2>diagnostic-artifacts/request-ab/wire-1.log
      - name: Repeat in the same runner, pairs 5 to 8
        run: python tests/check_youtube_request_ab.py 2 diagnostic-artifacts/request-ab/wire-2.log 2>diagnostic-artifacts/request-ab/wire-2.log
      - name: Repeat in the same runner, pairs 9 to 12
        run: python tests/check_youtube_request_ab.py 3 diagnostic-artifacts/request-ab/wire-3.log 2>diagnostic-artifacts/request-ab/wire-3.log
      - name: Save sanitized comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-request-library-ab
          path: diagnostic-artifacts/request-ab/
          retention-days: 7
          if-no-files-found: error
