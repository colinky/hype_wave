name: Recording stability regression

on:
  pull_request:
  push:
    branches: [main, codex/ytmusic-id-stability]
    paths: ['**.py', 'requirements.txt', 'matching_alias.json', 'sync_config.json', 'ytmusic_validation_config.json', 'docs/index.html', '.github/workflows/recording-stability-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exercise recording and recovery contracts without external access
        env:
          SUPABASE_DB_URL: ''
        run: python tests/run_offline_suite.py
      - name: Save regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-recording-contracts-${{ github.run_id }}
          path: tests/_artifacts/id_stability/offline_suite.*
          retention-days: 7
