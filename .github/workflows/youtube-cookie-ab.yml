name: YouTube Cookie Sharing Diagnostic

on:
  push:
    branches: [codex/youtube-cookie-ab]
    paths:
      - tests/check_youtube_cookie_ab.py
      - .github/workflows/youtube-cookie-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cookie-ab:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.59.0-noble@sha256:d8d9811a0e7cfac967f0c2f55d12b739087ae4b0808577b794c2a29ed5124938
      options: --init
    timeout-minutes: 20
    env:
      HYPE_DB_BACKEND: sqlite
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install unchanged production dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare initial cookie sharing in one runner without database or playlist writes
        run: python tests/check_youtube_cookie_ab.py
      - name: Save sanitized observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-cookie-ab
          path: diagnostic-artifacts/cookie-ab/
          retention-days: 7
          if-no-files-found: error
