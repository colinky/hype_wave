name: YouTube Header and Cookie Factors

on:
  push:
    branches: [codex/youtube-header-cookie-factors]
    paths:
      - tests/check_youtube_header_cookie_factors.py
      - .github/workflows/youtube-header-cookie-factors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factors:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.59.0-noble@sha256:d8d9811a0e7cfac967f0c2f55d12b739087ae4b0808577b794c2a29ed5124938
      options: --init
    timeout-minutes: 40
    env:
      HYPE_DB_BACKEND: sqlite
      PYTHONUNBUFFERED: '1'
      NODE_OPTIONS: '--max-http-header-size=262144'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install unchanged dependencies and prepare evidence directory
        run: |
          python -m pip install -r requirements.txt
          mkdir -p diagnostic-artifacts/header-cookie-factors
      - name: Compare six conditions, rounds 1 and 2
        run: python tests/check_youtube_header_cookie_factors.py 1 diagnostic-artifacts/header-cookie-factors/wire-1.log 2>diagnostic-artifacts/header-cookie-factors/wire-1.log
      - name: Repeat in the same runner, rounds 3 and 4
        run: python tests/check_youtube_header_cookie_factors.py 2 diagnostic-artifacts/header-cookie-factors/wire-2.log 2>diagnostic-artifacts/header-cookie-factors/wire-2.log
      - name: Repeat in the same runner, rounds 5 and 6
        run: python tests/check_youtube_header_cookie_factors.py 3 diagnostic-artifacts/header-cookie-factors/wire-3.log 2>diagnostic-artifacts/header-cookie-factors/wire-3.log
      - name: Repeat in the same runner, rounds 7 and 8
        run: python tests/check_youtube_header_cookie_factors.py 4 diagnostic-artifacts/header-cookie-factors/wire-4.log 2>diagnostic-artifacts/header-cookie-factors/wire-4.log
      - name: Save sanitized observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-header-cookie-factors
          path: diagnostic-artifacts/header-cookie-factors/
          retention-days: 7
          if-no-files-found: error
