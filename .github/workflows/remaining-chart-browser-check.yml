name: Remaining chart browser comparison
on:
  push:
    branches: [codex/remaining-chart-browser-check]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.59.0-noble
      options: --init
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Compare official Melon and YouTube charts without publishing
        run: python tests/probe_remaining_charts.py
