name: Export the November 22 history edition
on:
  push:
    branches: [codex/history-20261122]
    paths: [export_20261122.py, .github/workflows/export-20261122.yml]
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Prepare read-only music lookup
        env:
          BROWSER_JSON: ${{ secrets.YTMUSIC_BROWSER_JSON }}
        run: |
          umask 077
          test -n "$BROWSER_JSON"
          printf '%s' "$BROWSER_JSON" > "$RUNNER_TEMP/music-auth.json"
      - name: Read the completed charts and verify the November 22 edition
        env:
          HYPE_DB_BACKEND: aiven
          YTMUSIC_AUTH_FILE: ${{ runner.temp }}/music-auth.json
          AIVEN_DB_URI: ${{ secrets.AIVEN_DB_URI }}
          AIVEN_DB_HOST: ${{ secrets.AIVEN_DB_HOST }}
          AIVEN_DB_CA_CERTIFICATE: ${{ secrets.AIVEN_DB_CA_CERTIFICATE }}
        run: python export_20261122.py
      - name: Save the verified file on the export branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- docs/api/history.json
          git commit -m 'Generate November 22 history from November 21 chart sources'
          git push origin HEAD:refs/heads/codex/history-20261122
      - if: always()
        run: rm -f "$RUNNER_TEMP/music-auth.json"
