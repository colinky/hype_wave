name: Daily Unified Music Sync

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:05 UTC (16:05 KST); sync_all uses UTC scheduling weekdays.
    # YouTube runs only on UTC Mondays; other incomplete weekly tasks can catch up.
    - cron: "5 7 * * *"

concurrency:
  group: daily-unified-music-sync
  cancel-in-progress: false

jobs:
  sync-all:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.59.0-noble
      options: --init
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HYPE_DB_BACKEND: aiven
      AIVEN_DB_URI: ${{ secrets.AIVEN_DB_URI }}
      AIVEN_DB_HOST: ${{ secrets.AIVEN_DB_HOST }}
      AIVEN_DB_CA_CERTIFICATE: ${{ secrets.AIVEN_DB_CA_CERTIFICATE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore YouTube Music browser auth file from secret
        shell: bash
        env:
          YTMUSIC_BROWSER_JSON: ${{ secrets.YTMUSIC_BROWSER_JSON }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .secrets
          printf '%s' "$YTMUSIC_BROWSER_JSON" > .secrets/browser.json
          chmod 600 .secrets/browser.json

      - name: Run Enabled Sync Tasks
        id: sync
        shell: bash
        env:
          YTMUSIC_AUTH_FILE: .secrets/browser.json
        run: |
          set -euo pipefail
          python sync_all.py

      - name: Commit and Push Verified Historical Web Data
        if: ${{ !cancelled() && steps.sync.outputs.history_ready == 'true' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f -- docs/api/history.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update verified chart history [$(date +'%Y-%m-%d')]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi

      - name: Remove browser authentication
        if: always()
        run: rm -f .secrets/browser.json
