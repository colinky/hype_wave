name: Daily Unified Music Sync

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:05 UTC (16:05 KST); sync_all uses UTC scheduling weekdays.
    # Incomplete weekly tasks retry on later daily runs; official source periods are preserved.
    - cron: "5 7 * * *"

concurrency:
  group: daily-unified-music-sync
  cancel-in-progress: false

jobs:
  sync-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HYPE_DB_BACKEND: aiven
      AIVEN_DB_URI: ${{ secrets.AIVEN_DB_URI }}
      AIVEN_DB_HOST: ${{ secrets.AIVEN_DB_HOST }}
      AIVEN_DB_CA_CERTIFICATE: ${{ secrets.AIVEN_DB_CA_CERTIFICATE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install chart fallback browser
        run: python -m playwright install --with-deps webkit

      - name: Run regression tests
        env:
          HYPE_DB_BACKEND: sqlite
        run: python -m unittest discover -s tests -v

      - name: Restore YouTube Music browser auth file from secret
        shell: bash
        env:
          YTMUSIC_BROWSER_JSON: ${{ secrets.YTMUSIC_BROWSER_JSON }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .secrets
          printf '%s' "$YTMUSIC_BROWSER_JSON" > .secrets/browser.json
          chmod 600 .secrets/browser.json

      - name: Run Enabled Sync Tasks
        id: sync
        shell: bash
        env:
          YTMUSIC_AUTH_FILE: .secrets/browser.json
        run: |
          set -euo pipefail
          python sync_all.py

      - name: Commit and Push Verified Chart Snapshots and Historical Web Data
        if: ${{ !cancelled() }}
        env:
          HISTORY_READY: ${{ steps.sync.outputs.history_ready }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ "$HISTORY_READY" = "true" ]; then
            git add -f -- docs/api/history.json
          fi
          # Preserve complete source captures even if another sync task failed.
          git add snapshots/youtube-charts/*.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update verified chart snapshots and history [$(date +'%Y-%m-%d')]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi

      - name: Remove browser authentication
        if: always()
        run: rm -f .secrets/browser.json
