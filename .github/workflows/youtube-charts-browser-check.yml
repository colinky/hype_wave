name: YouTube Charts Browser Check

on:
  workflow_dispatch:
  push:
    branches: [codex/youtube-browser-fallback]
  pull_request:
    paths:
      - ytmusic_playlist_sync.py
      - tests/test_playlist_count_retry.py
      - tests/test_playlist_delta.py
      - tests/test_artist_metadata_layout.py
      - tests/check_artist_metadata.py
      - hype_db_store.py
      - hype_db_reports.py
      - crawler_common.py
      - sync_all.py
      - sync_validation.py
      - tests/test_weekly_pipeline.py
      - tests/test_ytmusic_monday_schedule.py
      - reconcile_playlist_update.py
      - ytmusic_to_ytmusic_crawl.py
      - requirements.txt
      - tests/test_youtube_charts*.py
      - tests/check_youtube_charts_browser.py
      - tests/check_history_rebuild.py
      - .github/workflows/daily-sync.yml
      - .github/workflows/youtube-charts-browser-check.yml

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.59.0-noble
      options: --init
    timeout-minutes: 10
    env:
      HYPE_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify production history publication in the container
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, textwrap
          from pathlib import Path
          workspace = os.environ['GITHUB_WORKSPACE']
          before = subprocess.run(['git', '-c', 'safe.directory=', 'status', '--porcelain'], capture_output=True, text=True)
          assert before.returncode == 128 and 'dubious ownership' in before.stderr, before.stderr
          remote = Path(os.environ['RUNNER_TEMP']) / 'history-publication-check.git'
          subprocess.run(['git', 'init', '--bare', str(remote)], cwd=remote.parent, check=True)
          subprocess.run(['git', f'--git-dir={remote}', 'config', 'receive.shallowUpdate', 'true'], check=True)
          subprocess.run(['git', '-c', f'safe.directory={workspace}', 'remote', 'set-url', 'origin', str(remote)], check=True)
          history = Path('docs/api/history.json')
          history.write_bytes(history.read_bytes() + b'\n')
          workflow = Path('.github/workflows/daily-sync.yml').read_text()
          section = workflow.split('      - name: Commit and Push Verified Historical Web Data\n', 1)[1]
          script = textwrap.dedent(section.split('        run: |\n', 1)[1].split('\n      - name:', 1)[0])
          script = script.replace('$' + '{{ github.ref_name }}', 'publication-check')
          subprocess.run(['sh', '-e'], input=script, text=True, check=True)
          published = subprocess.check_output(['git', f'--git-dir={remote}', 'show', 'refs/heads/publication-check:docs/api/history.json'])
          assert published == history.read_bytes()
          print('PASS: reproduced ownership failure; production add/commit/push succeeded against an isolated local remote')
          PY
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify live artist metadata without database or playlist writes
        run: python tests/check_artist_metadata.py
      - name: Verify official weekly collection and outage fallback without database or playlist writes
        run: python tests/check_youtube_charts_browser.py browser-chart.json
      - name: Save verified official weekly chart
        uses: actions/upload-artifact@v4
        with:
          name: official-kr-weekly-chart
          path: browser-chart.json
          retention-days: 1

  history-check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check database and rebuild history without publishing
        env:
          HYPE_DB_BACKEND: aiven
          AIVEN_DB_URI: ${{ secrets.AIVEN_DB_URI }}
          AIVEN_DB_HOST: ${{ secrets.AIVEN_DB_HOST }}
          AIVEN_DB_CA_CERTIFICATE: ${{ secrets.AIVEN_DB_CA_CERTIFICATE }}
        run: python tests/check_history_rebuild.py diagnostic-artifacts/history.json
      - name: Save validated rebuilt history
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-history
          path: diagnostic-artifacts/
          retention-days: 7
