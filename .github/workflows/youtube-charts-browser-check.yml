name: YouTube Charts Browser Check
run-name: Official KR weekly CSV download on GitHub-hosted WebKit
on:
  push:
    branches: [codex/verify-kr-chart-csv-20261123]
    paths: ['check_kr_weekly_csv.py']
permissions:
  contents: read
jobs:
  verify-csv:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.59.0-noble
      options: --init
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Download the dated South Korea Top Songs CSV and compare with Safari
        run: python check_kr_weekly_csv.py
      - name: Save the verified official CSV
        uses: actions/upload-artifact@v4
        with:
          name: official-kr-weekly-csv-20261119
          path: youtube-charts-top-songs-kr-weekly-20261119.csv
          if-no-files-found: error
          retention-days: 7
